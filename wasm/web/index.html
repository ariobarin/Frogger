<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frogger</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { display: grid; place-items: center; }
  canvas { display: block; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #bbb; font: 15px/1.5 system-ui, sans-serif; }

  /* Java's "Game Over! Enter your name:" dialog (a Metal JOptionPane), drawn at the game's scale */
  #ask { position: fixed; left: 50%; top: 50%; width: 300px; transform: translate(-50%, -50%) scale(var(--scale, 1));
    background: #eee; border: 1px solid #7a8a99; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    font: bold 12px Tahoma, Arial, sans-serif; color: #333; }
  #ask[hidden] { display: none; }
  #ask .title { padding: 6px 8px; background: #fff; color: #000; font-weight: normal; }
  #ask .body { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 14px 14px 10px; align-items: center; }
  #ask .icon { grid-row: span 2; width: 32px; height: 32px; border-radius: 6px; background: #6382bf; color: #fff;
    display: grid; place-items: center; font-size: 22px; }
  #ask input { font: 12px Tahoma, Arial, sans-serif; padding: 2px 3px; border: 1px solid #7a8a99; }
  #ask .buttons { display: flex; justify-content: flex-end; gap: 6px; padding: 0 14px 14px; }
  #ask button { font: inherit; color: #333; min-width: 70px; padding: 4px 10px; border: 1px solid #7a8a99;
    background: linear-gradient(#fff, #dde8f3); }
</style>
</head>
<body>
<div id="status">Loading Frogger…</div>
<canvas id="screen" width="800" height="800"></canvas>
<form id="ask" hidden>
  <div class="title">Input</div>
  <div class="body">
    <div class="icon">?</div>
    <label for="name">Game Over! Enter your name:</label>
    <input id="name" autocomplete="off" spellcheck="false">
  </div>
  <div class="buttons"><button type="submit">OK</button><button type="button" id="cancel">Cancel</button></div>
</form>
<script type="module">
  // Frogger, compiled from Rust to WebAssembly (frogger.wasm, with the game's images built in). This
  // page decodes the images, runs the game on every animation frame and passes it the keyboard and
  // mouse; src/lib.rs has the other side.
  //
  // ariobarin.com opens this page with #preload while the visitor reads, then calls ariobarinPlay()
  // when Play is pressed. Until then the game holds its title screen and leaves the keyboard alone.
  const SIZE = 800
  const SCORES = "frogger-scores"
  const canvas = document.getElementById("screen")
  const context = canvas.getContext("2d", { alpha: false })
  const ask = document.getElementById("ask")
  const nameField = document.getElementById("name")

  window.ariobarinPlaying = location.hash != "#preload"
  window.ariobarinPaused = false
  window.ariobarinPlay = () => {
    window.ariobarinPlaying = true
    window.ariobarinPaused = false
    window.focus()
  }

  // show the 800x800 game as large as the window allows; scaled up it keeps its hard pixel edges
  function fit() {
    const scale = Math.min(innerWidth / SIZE, innerHeight / SIZE)
    canvas.style.width = canvas.style.height = `${SIZE * scale}px`
    canvas.style.imageRendering = scale * devicePixelRatio >= 1 ? "pixelated" : "auto"
    document.documentElement.style.setProperty("--scale", scale)
  }
  addEventListener("resize", fit)
  fit()

  let game
  const bytes = (pointer, length) => new Uint8Array(game.memory.buffer, pointer, length)
  const text = (pointer, length) => new TextDecoder().decode(bytes(pointer, length))
  function storage(action) {
    try { return action(localStorage) } catch { return null } // storage can be off (private windows, settings)
  }

  const imports = {
    env: {
      ask_name() {
        ask.hidden = false
        nameField.value = ""
        nameField.focus()
      },
      save_scores(pointer, length) {
        const scores = text(pointer, length)
        storage((s) => s.setItem(SCORES, scores))
      },
    },
  }
  const { instance } = await WebAssembly.instantiateStreaming(fetch("frogger.wasm"), imports)
  game = instance.exports

  // the browser decodes the PNGs; the game gets their raw pixels
  const scratch = document.createElement("canvas").getContext("2d", { willReadFrequently: true })
  await Promise.all(Array.from({ length: game.asset_count() }, async (_, i) => {
    const png = new Blob([bytes(game.asset_bytes(i), game.asset_length(i))], { type: "image/png" })
    const bitmap = await createImageBitmap(png, { premultiplyAlpha: "none", colorSpaceConversion: "none" })
    scratch.canvas.width = bitmap.width
    scratch.canvas.height = bitmap.height
    scratch.clearRect(0, 0, bitmap.width, bitmap.height)
    scratch.drawImage(bitmap, 0, 0)
    const pixels = scratch.getImageData(0, 0, bitmap.width, bitmap.height).data
    bytes(game.image_pixels(i, bitmap.width, bitmap.height), pixels.length).set(pixels)
  }))

  const saved = new TextEncoder().encode(storage((s) => s.getItem(SCORES)) || "")
  bytes(game.text_buffer(saved.length), saved.length).set(saved)
  const seed = crypto.getRandomValues(new Uint32Array(2))
  game.start(seed[0], seed[1], saved.length)

  let image
  function show() {
    if (!image || image.data.buffer !== game.memory.buffer) {
      image = new ImageData(new Uint8ClampedArray(game.memory.buffer, game.screen_pixels(), SIZE * SIZE * 4), SIZE, SIZE)
    }
    context.putImageData(image, 0, 0)
  }

  let shown = false
  requestAnimationFrame(function tick(now) {
    // preloading: show the title screen, then hold until Play
    if (shown && !window.ariobarinPlaying) {
      window.ariobarinPaused = true
    } else if (game.frame(now)) {
      show()
      if (!shown) {
        shown = true
        document.getElementById("status").remove()
      }
    }
    requestAnimationFrame(tick)
  })

  // the game's keys are java.awt.event.KeyEvent codes, which match the browser's keyCode
  const KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40 }
  // the game sits inside a project page: the keys it uses must not scroll that page
  const SCROLL_KEYS = [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"]
  for (const [type, down] of [["keydown", 1], ["keyup", 0]]) {
    addEventListener(type, (event) => {
      if (!ask.hidden) return
      if (SCROLL_KEYS.includes(event.key)) event.preventDefault()
      game.key(KEYS[event.key] ?? event.keyCode, down)
    })
  }

  function point(event) {
    const box = canvas.getBoundingClientRect()
    return [Math.floor((event.clientX - box.left) * SIZE / box.width), Math.floor((event.clientY - box.top) * SIZE / box.height)]
  }
  // Swing only reports a move while no button is held (otherwise it's a drag)
  canvas.addEventListener("mousemove", (event) => { if (!event.buttons && ask.hidden) game.mouse_move(...point(event)) })
  canvas.addEventListener("mousedown", (event) => { if (ask.hidden) game.mouse_press(...point(event)) })

  function answer(name) {
    ask.hidden = true
    nameField.blur()
    const encoded = new TextEncoder().encode(name ?? "")
    bytes(game.text_buffer(encoded.length), encoded.length).set(encoded)
    game.name_entered(encoded.length, name == null ? 0 : 1)
  }
  ask.addEventListener("submit", (event) => { event.preventDefault(); answer(nameField.value) })
  document.getElementById("cancel").addEventListener("click", () => answer(null))
  nameField.addEventListener("keydown", (event) => { if (event.key == "Escape") answer(null) })
</script>
</body>
</html>
