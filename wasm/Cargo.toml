[package]
name = "frogger"
version = "1.0.0"
edition = "2024"
description = "Frogger compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
png = "0.17"
