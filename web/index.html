<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frogger</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #bbb; font: 15px/1.5 system-ui, sans-serif; }
  /* the game's 800x800 window at its own size: CheerpJ sizes its canvas from the element's on-screen
     box, so scaling happens outside (ariobarin.com scales the whole frame this page sits in) */
  #display { position: absolute; left: 0; top: 0; width: 800px; height: 800px; }
</style>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<div id="status">Loading Frogger…</div>
<div id="display"></div>
<script>
  // Frogger runs on CheerpJ (a Java runtime in WebAssembly), from frogger.jar next to this page, with
  // the game's images packed inside it. The page fetches the jar itself and hands it to CheerpJ in
  // memory (/str/): CheerpJ's own file reads use HTTP range requests, which a CDN may only honour
  // once the file is in its cache.
  //
  // ariobarin.com opens this page with #preload while the visitor reads, then calls ariobarinPlay()
  // when Play is pressed. Until then the game sits on its title screen and must not take the
  // keyboard from the page around it.
  const SIZE = 800
  const display = document.getElementById("display")

  window.ariobarinPlaying = location.hash != "#preload"
  window.ariobarinPaused = false
  const focusWindow = window.focus
  const focusElement = HTMLElement.prototype.focus
  if (!window.ariobarinPlaying) {
    window.focus = () => {}
    HTMLElement.prototype.focus = function () {}
  }
  window.ariobarinPlay = () => {
    window.ariobarinPlaying = true
    window.ariobarinPaused = false
    window.focus = focusWindow
    HTMLElement.prototype.focus = focusElement
  }

  // the game sits inside a project page: the keys it uses must not scroll that page, and the mouse
  // wheel (which the game doesn't use) should scroll it as usual
  const SCROLL_KEYS = [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"]
  addEventListener("keydown", (event) => { if (SCROLL_KEYS.includes(event.key)) event.preventDefault() }, true)
  addEventListener("wheel", (event) => event.stopImmediatePropagation(), { capture: true })

  // the title screen is up once CheerpJ has drawn the game's window
  new MutationObserver((changes, observer) => {
    if (!display.querySelector("canvas")) return
    observer.disconnect()
    setTimeout(() => {
      document.getElementById("status").remove()
      if (!window.ariobarinPlaying) window.ariobarinPaused = true
    }, 500)
  }).observe(display, { childList: true, subtree: true })

  ;(async () => {
    const jar = fetch("frogger.jar").then((response) => response.arrayBuffer())
    await cheerpjInit({
      version: 17,
      status: "none",
      javaProperties: ["frogger.web=1", "frogger.scores=/files/frogger-scores.txt"],
    })
    cheerpOSAddStringFile("/str/frogger.jar", new Uint8Array(await jar))
    cheerpjCreateDisplay(SIZE, SIZE, display)
    await cheerpjRunJar("/str/frogger.jar")
  })()
</script>
</body>
</html>
